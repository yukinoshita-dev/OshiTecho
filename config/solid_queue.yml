default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      polling_interval: 0.1
  recurring_tasks:
    event_reminder:
      class: EventReminderJob
      schedule: "0 8 * * *"
      description: "毎朝8時に翌日イベントのリマインダーを送信"

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
  workers:
    - queues: "*"
      threads: 5
      polling_interval: 0.1
