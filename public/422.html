<!doctype html>
<html lang="ja">
<head>
  <title>リクエストエラー - 推し手帳</title>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, width=device-width">
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    body {
      background: #faf8f2;
      color: #3d2b1f;
      display: grid;
      place-items: center;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 2rem;
    }
    .card {
      background: #f5f0e8;
      border: 1px solid #d4b896;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(139,99,68,.15);
      padding: 3rem 2rem;
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    .emoji { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: bold; margin-bottom: 0.5rem; color: #8b6344; }
    p { font-size: 0.9rem; color: #7a6050; margin-bottom: 1.5rem; }
    a {
      display: inline-block;
      background: #8b6344;
      color: #fff;
      border-radius: 4px;
      padding: 0.5rem 1.5rem;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
    }
    a:hover { background: #6d4c33; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🔒</div>
    <h1>リクエストを処理できません</h1>
    <p>不正なリクエストが検出されました。もう一度お試しください。</p>
    <a href="/">トップページへ戻る</a>
  </div>
</body>
</html>
