services:
  - type: web
    name: oshi-techo
    env: ruby
    region: singapore
    plan: free
    buildCommand: "./bin/render-build.sh"
    preDeployCommand: "bundle exec rails db:migrate"
    startCommand: "bin/rails server -p $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oshi-techo-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: WEB_CONCURRENCY
        value: 1
      - key: RAILS_MAX_THREADS
        value: 3
      - key: MALLOC_ARENA_MAX
        value: 2

databases:
  - name: oshi-techo-db
    databaseName: oshi_techo_production
    region: singapore
    plan: free
